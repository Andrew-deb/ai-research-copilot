command:
  - "gunicorn"
  - "app:app"
  - "--bind"
  - "0.0.0.0:8080"
  - "--workers"
  - "2"
  - "--threads"
  - "4"
  - "--worker-class"
  - "gthread"
  - "--timeout"
  - "120"
  - "--graceful-timeout"
  - "30"
  - "--worker-tmp-dir"
  - "/dev/shm"

env:
  - name: "PYTHONUNBUFFERED"
    value: "1"
  # dashboard/requirements.txt has no torch, so use the hosted model here too —
  # one embedding path on every host. Needs the `huggingface` secret scope
  # (key `api-token`) or an HF_API_TOKEN env var.
  - name: "EMBEDDING_BACKEND"
    value: "hf_api"
  # Load the embedding model at startup (per worker) instead of on first use.
  - name: "EMBEDDING_PRELOAD"
    value: "true"
  # Pooled Lakebase connections per worker (2 workers x 8 = 16 max).
  - name: "DB_POOL_MAX"
    value: "8"
  - name: "REQUIRE_FORWARDED_AUTH"
    value: "false"
