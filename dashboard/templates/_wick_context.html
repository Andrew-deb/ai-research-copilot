<div class="wick-context-controls" id="wick-context-controls" {% if chat_mode != 'wick' and not wick_panel %}hidden{% endif %}>
  <button type="button" id="wick-add-context" class="btn btn-ghost btn-sm" aria-haspopup="dialog">＋ Add context</button>
  <div id="wick-context-chips" aria-label="Selected context"></div>
  <p id="wick-context-status" role="status" aria-live="polite"></p>
</div>
<script type="application/json" id="wick-context-data">{{ (context["items"] if context and context["items"] else []) | tojson }}</script>
