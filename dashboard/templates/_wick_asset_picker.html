<div id="wick-asset-picker" class="wick-asset-picker" role="dialog" aria-modal="false" aria-labelledby="wick-asset-title" hidden>
  <div class="wick-asset-heading"><button type="button" id="wick-asset-back" aria-label="Back to categories">‹</button><strong id="wick-asset-title">Assets</strong><button type="button" id="wick-asset-close" aria-label="Close context picker">×</button></div>
  <div class="wick-asset-search">
    <input id="wick-asset-query" type="search" maxlength="300" placeholder="Search assets" aria-label="Search context">
    <div id="wick-asset-kind" class="wick-asset-types" aria-label="Asset type">
      <button type="button" data-kind="" aria-pressed="true">All</button><button type="button" data-kind="paper" aria-pressed="false">Papers</button><button type="button" data-kind="note" aria-pressed="false">Notes</button><button type="button" data-kind="collection" aria-pressed="false">Collections</button><button type="button" data-kind="goal" aria-pressed="false">Goals</button>
    </div>
  </div>
  <p id="wick-asset-status" role="status" aria-live="polite"></p>
  <div id="wick-asset-results" aria-label="Matching context"></div>
  <button type="button" id="wick-asset-more" class="btn btn-ghost btn-sm" hidden>Load more</button>
</div>
