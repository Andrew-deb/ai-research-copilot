{% if private_uploads_enabled and is_authenticated %}
  <div class="private-files" id="private-files" data-max-mib="{{ upload_max_mib }}" data-retention="{{ upload_retention_days }}">
    <div id="upload-list" aria-label="Uploaded files"></div>
    <p id="upload-status" role="status" aria-live="polite"></p>
  </div>
{% endif %}
