# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploys the Flask dashboard as a long-lived web service. Render runs a normal
# container, so gunicorn, the Lakebase connection pool and the request-scoped
# identity middleware all work unchanged from the Databricks App deployment.
#
# Set the `sync: false` values in the Render dashboard (they are secrets):
#   DATABASE_URL       postgresql://<role>:<pw>@<host>/databricks_postgres?sslmode=require
#   OPENROUTER_API_KEY sk-or-v1-...        (omit to hide the RAG box)
#   HF_API_TOKEN       hf_...              (read token; https://huggingface.co/settings/tokens)

services:
  - type: web
    name: alfred
    runtime: python
    plan: free
    # Build from repo root so authoritative prompts can be bundled.
    # Runtime still uses the flat dashboard artifact as its working directory.
    rootDir: .
    region: oregon
    healthCheckPath: /healthz
    buildCommand: python mcp_server/deploy/build.py --target render && pip install -r dist/deploy/render/requirements.txt
    # One worker: the free instance is 512 MB / 0.1 CPU. Threads (not processes)
    # give concurrency, and every slow call here is I/O — Postgres, OpenRouter, HF.
    #
    # Four threads, but a STREAMED agent turn holds two of them: one for the SSE
    # response and one for the worker running the turn. So two concurrent
    # research questions is the real ceiling, and the third visitor waits. That
    # is acceptable at these quota levels and is the number to revisit first if
    # the free tier is ever outgrown.
    #
    # The timeout is the OUTER limit; AGENT_DEADLINE_SECONDS is the inner one.
    # dashboard/config.py explains the relationship and warns at boot if the gap
    # between them is too small to cover synthesis and delivery.
    startCommand: >-
      cd dist/deploy/render && gunicorn app:app
      --bind 0.0.0.0:$PORT
      --workers 1
      --threads 4
      --worker-class gthread
      --timeout ${GUNICORN_TIMEOUT_SECONDS:-180}
      --graceful-timeout 30
    envVars:
      # Apply sql/29_private_uploads.sql and configure Azure secrets before enabling.
      - key: UPLOADS_ENABLED
        sync: false
      - key: UPLOAD_WORKER_ENABLED
        value: "true"
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        sync: false
      # Provider failover. A single credential is a single point of failure
      # for the only part of this application that cannot degrade gracefully:
      # revoke it, let it expire, or have the provider reject it for a reason
      # of its own, and every AI feature stops at once.
      #
      # OPENROUTER_API_KEY alone is a complete configuration and behaves
      # exactly as it always has. The numbered ones are optional; each is tried
      # in turn when the one before it cannot serve a request.
      #
      # All sync: false - set in the Render dashboard, never in this file.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY_1
        sync: false
      - key: OPENROUTER_API_KEY_2
        sync: false
      - key: OPENROUTER_API_KEY_3
        sync: false
      # Pinned here, not left to the default in dashboard/config.py.
      #
      # This file previously named no model at all, so production silently used
      # whatever that default happened to be - and twice that default was a
      # `:free` slug OpenRouter had since retired, which 404s on every call.
      # A model this service depends on belongs in the deployment it runs in,
      # where changing it is a diff rather than a discovery.
      #
      # Safe to change: it is one variable, and reverting needs no code edit.
      # Two providers serve this model, which is why it is this one and not the
      # -vl variant that measured better: a single-provider model was observed
      # returning `engine_overloaded` on all three credentials for twenty
      # minutes, and no amount of credential failover routes around a busy
      # provider. See dashboard/config.py.
      - key: OPENROUTER_MODEL
        value: "inclusionai/ling-3.0-flash"
      # Research agent -> MCP server on Databricks (Phase 3.4).
      # Omit all four and the assistant reports itself unavailable; search, RAG,
      # collections and notes are unaffected.
      - key: DATABRICKS_HOST
        sync: false
      - key: DATABRICKS_CLIENT_ID
        sync: false
      - key: DATABRICKS_CLIENT_SECRET
        sync: false
      - key: RESEARCH_MCP_SERVER_URL
        sync: false
      - key: WICK_MCP_SERVER_URL
        sync: false
      - key: MCP_SERVER_URL
        sync: false
      # Google OAuth — create at https://console.cloud.google.com/apis/credentials
      # Authorised redirect URI must be exactly:
      #   https://<service>.onrender.com/auth/google/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: HF_API_TOKEN
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      # Operator-selected remote backend; do not reset a verified Databricks
      # rollout back to hf_api when the Blueprint is synchronized.
      - key: EMBEDDING_BACKEND
        sync: false
      # Wake the hosted model in a background thread at boot so the first
      # semantic search isn't the one that pays for it.
      - key: EMBEDDING_PRELOAD
        value: "true"
      # Selects production posture: Secure session cookies, and config refuses to
      # boot if the dev bypass or the default secret key are still set.
      - key: APP_ENV
        value: production

      # One proxy in front: Render terminates TLS and forwards plain HTTP. Without
      # this the app builds its Google callback as http://, which Google refuses
      # for any host but localhost - so sign-in works locally and fails here with
      # redirect_uri_mismatch. See dashboard/config.py for why it is a count
      # rather than a production-only branch.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # ON: the capability layer shipped in 3.2, so an anonymous visitor can
      # search, ask and browse the curated collections but holds no persistent
      # capability at all — no library, notes, progress or chat history. That is
      # the tier the pricing page describes, and leaving this off would make the
      # deployed product quieter than its own documentation.
      #
      # The bill is protected by the GLOBAL ceilings below, not by this flag:
      # per-visitor limits shape behaviour and reset when someone clears a
      # cookie, while the global ones cannot be cleared by anybody.
      - key: ALLOW_ANONYMOUS_DEMO
        value: "true"
      # One worker, and Lakebase free tiers are stingy with connections.
      - key: DB_POOL_MAX
        value: "3"
      - key: PYTHONUNBUFFERED
        value: "1"

      # --- Timeouts -------------------------------------------------------
      # Outer limit, passed to the start command above. Must stay comfortably
      # above AGENT_DEADLINE_SECONDS; see dashboard/config.py.
      - key: GUNICORN_TIMEOUT_SECONDS
        value: "180"
      # Inner research budget: how long the agent may keep searching before it
      # must stop and write the answer.
      - key: AGENT_DEADLINE_SECONDS
        value: "75"
      # Four, not six, after the 6 October calibration: the tail is what
      # exhausts a 50-request daily allowance, and capping it buys questions
      # back for everyone. Raise it on a paid provider and re-calibrate — see
      # the note in dashboard/config.py.
      - key: AGENT_MAX_TOOL_CALLS
        value: "4"
      - key: AGENT_MAX_TOKENS
        value: "2400"

      # --- Metering -------------------------------------------------------
      # Explicit rather than relying on the code default: this is the switch
      # that decides whether the product has a bill it can survive, and it
      # should be visible in the deployment rather than inferred.
      # One trivial query every N seconds, to stop Lakebase's free tier
      # suspending its compute after ~5 minutes idle. A cold connect measured
      # 9.8 s against 0.33 s warm. 0 disables.
      #
      # This only runs while the service is awake. Protecting the endpoint
      # overnight is the external schedule's job — see
      # context/setup/pinger_setup.md. The two are not interchangeable.
      - key: DB_KEEPWARM_SECONDS
        value: "240"

      - key: QUOTAS_ENABLED
        value: "true"

      # CALIBRATED 6 October 2026 by scripts/calibrate_quotas.py, against 41
      # real agent runs and the OpenRouter account's own stated allowance.
      #
      # The measurement that matters, and the one the placeholders missed:
      # ONE AGENT QUESTION IS NOT ONE PROVIDER REQUEST. 41 questions consumed
      # 101 OpenRouter requests — mean 2.46, p95 6, max 7. The old ceilings
      # (50 agent + 200 rag) would have asked for 323 requests a day against an
      # allowance of 50, so they never bound anything: OpenRouter refused first
      # and the quota layer was decorative.
      #
      #   50 allowance − 18 reserve (35%) = 32 distributable requests/day
      #     agent share 24 ÷ 2.46 (mean) = 9
      #     rag share    8 ÷ 1           = 8
      #
      # Sized by the MEAN, deliberately. §6c argues for p95, which gives 4 a
      # day across every visitor — defensible arithmetic and not a demo. The
      # mean is the most usable number that is still bounded, and the tail is
      # handled by capping AGENT_MAX_TOOL_CALLS instead.
      #
      # Re-run the script after changing the model, the tool budget, or the
      # provider. All three move, and these numbers are only true for one set.
      # Searches embed via Hugging Face and make no completion call, so they do
      # not draw on the allowance the rest of these protect.
      - key: ANON_SEARCH_PER_DAY
        value: "30"
      - key: ANON_RAG_PER_DAY
        value: "5"
      # Two, not one. The first question is spent learning how to ask; one
      # question cannot show what the agent does. The tier ceiling below is what
      # stops two-per-visitor being unbounded.
      - key: ANON_AGENT_PER_DAY
        value: "2"
      - key: USER_SEARCH_PER_DAY
        value: "300"
      # Enough to explore in one sitting. At five, a signed-in user spent their
      # day before finding out whether the tool was any good.
      - key: USER_RAG_PER_DAY
        value: "30"
      - key: USER_AGENT_PER_DAY
        value: "25"
      # The ceilings that actually protect the demo. Per-visitor limits reset
      # when somebody clears a cookie; these do not.
      #
      # Sized for roughly eight full sessions in a day, not from a budget: at
      # the configured model's measured cost a thousand questions is about
      # fifty cents, so money was never what bounded this. What is being
      # protected is the demo answering when somebody who matters opens the
      # link.
      - key: GLOBAL_RAG_PER_DAY
        value: "150"
      - key: GLOBAL_AGENT_PER_DAY
        value: "200"
      # The anonymous tier's share of that ceiling.
      #
      # A per-visitor limit cannot protect a shared pool — it resets with a
      # cleared cookie, so ten visitors at two questions each are twenty
      # questions however low it is set. This is the only limit that bounds the
      # tier, and it leaves the rest for people who signed in.
      - key: GLOBAL_ANON_AGENT_PER_DAY
        value: "40"
      # The backstop, in money rather than in requests.
      #
      # Every limit above counts requests, which is a proxy for spend that holds
      # only while the per-request cost holds — and the previous numbers were
      # built on a free-request counter that read zero while money was leaving
      # the account. This is the unit that cannot drift when the model changes.
      #
      # About fifty times normal use, so it should never fire in ordinary
      # operation. It exists for the case nobody predicted. 0 disables it.
      - key: GLOBAL_SPEND_USD_PER_DAY
        value: "1.00"
      # AGENT_MAX_TOOL_CALLS is set with the other agent settings above.
